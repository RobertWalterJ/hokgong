<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110F" media="(prefers-color-scheme: dark)">
<title>Hok Gong — learning to talk</title>
<meta name="description" content="A Cantonese app built on recorded speech: spaced retrieval, tones you can hear and say, and progress you can check.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* ── the palette ──────────────────────────────────────────────────────
   Two things the app needs you to tell apart are never separated by hue
   alone: right and wrong carry a tick and a cross, the skill bars carry
   numbers, and audits/colour-spec.mjs measures every pair at build time
   under normal vision and under all three forms of dichromacy. */
:root {
  --bg: #FBF7F0;
  --card: #FFFFFF;
  --ink: #1B1714;
  --muted: #5C534B;
  --line: #E3D9CB;
  --accent: #9A2A22;          /* a dark red: the colour of the paper lanterns, dark enough to read on */
  --accent-ink: #FFFFFF;
  --right: #1C5B34;
  --right-bg: #E7F2EA;
  --wrong: #8A2018;
  --wrong-bg: #FBEBE8;
  --chip: #F2EBE0;
  --focus: #1D4ED8;
  --ui: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --read: 'Literata', Georgia, 'Times New Roman', serif;
  --display: 'Bricolage Grotesque', var(--ui);
  /* Traditional characters. No CJK font is bundled: they run 5–15 MB, and
     every phone and desktop this app runs on already has one. */
  --han: 'PingFang HK', 'Hiragino Sans CNS', 'Noto Sans CJK TC', 'Noto Sans TC', 'Microsoft JhengHei', 'MingLiU', sans-serif;
  --read-size: 19px;
  --read-lh: 1.6;
  --read-measure: 62ch;
  --read-ls: 0;
  --read-font: var(--read);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110F;
    --card: #1E1A17;
    --ink: #F2EBE2;
    --muted: #B3A79A;
    --line: #38302A;
    --accent: #E9776A;
    --accent-ink: #1B1714;
    --right: #7FD6A0;
    --right-bg: #1B3326;
    --wrong: #F3968B;
    --wrong-bg: #3A2320;
    --chip: #29231F;
    --focus: #93B4FF;
  }
}
:root[data-theme="dark"] {
  --bg: #14110F; --card: #1E1A17; --ink: #F2EBE2; --muted: #B3A79A; --line: #38302A;
  --accent: #E9776A; --accent-ink: #1B1714; --right: #7FD6A0; --right-bg: #1B3326;
  --wrong: #F3968B; --wrong-bg: #3A2320; --chip: #29231F; --focus: #93B4FF;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
html.big { font-size: 118%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--ui); font-size: var(--read-size); line-height: var(--read-lh);
  letter-spacing: var(--read-ls);
  padding: 0 16px env(safe-area-inset-bottom) 16px;
  overflow-x: hidden;
}
main { max-width: var(--read-measure); margin: 0 auto 64px; }
p { margin: 0 0 .7em; }
a { color: var(--accent); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }

/* ── bar ─────────────────────────────────────────────────────────── */
.bar {
  position: sticky; top: 0; z-index: 5; background: var(--bg);
  display: flex; align-items: center; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) 0 10px;
  max-width: var(--read-measure); margin: 0 auto; border-bottom: 1px solid var(--line);
}
.bar h1 { flex: 1; margin: 0; font: 600 1rem/1.3 var(--ui); letter-spacing: .01em; }
.wordmark { display: flex; align-items: baseline; gap: 8px; flex: 1; }
.wordmark .han { font-family: var(--han); font-size: 1.35rem; color: var(--accent); }
.wordmark span + span { font: 600 .95rem var(--display); letter-spacing: .02em; }
button { font: inherit; color: inherit; }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center;
  background: none; border: 0; border-radius: 12px; cursor: pointer; color: var(--muted);
}
.icon:hover { background: var(--chip); color: var(--ink); }
.icon svg { width: 22px; height: 22px; }
.chev { display: inline-grid; place-items: center; color: var(--muted); }
.chev svg { width: 20px; height: 20px; }

/* ── cards and rows ──────────────────────────────────────────────── */
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px; margin: 16px 0;
}
.card h2 { margin: 0 0 .5em; font: 600 1.15rem/1.3 var(--display); }
.card h3 { margin: 1em 0 .3em; font: 600 1rem/1.3 var(--display); }
.eyebrow { font: 600 .72rem/1 var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.note { color: var(--muted); font-size: .86em; }
.note.centre { text-align: center; }
.note-card { background: none; border-style: dashed; }
.evidence { color: var(--muted); font-size: .78em; line-height: 1.5; margin-top: .6em; }
.warn { color: var(--wrong); }
.good { color: var(--right); }
.watch { border-left: 3px solid var(--accent); padding-left: 12px; color: var(--muted); }

.rows { display: flex; flex-direction: column; gap: 8px; margin: 18px 0 40px; }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  background: var(--card); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; cursor: pointer; min-height: 56px;
}
.row:hover { border-color: var(--accent); }
.row > div:first-child { flex: 1; }
.rlabel { font-weight: 600; }
.word-row { display: grid; grid-template-columns: auto auto 1fr auto; align-items: baseline; gap: 12px; }

/* ── type ────────────────────────────────────────────────────────── */
.han { font-family: var(--han); line-height: 1.35; }
.han.big { font-size: 2.6rem; margin: .2em 0; letter-spacing: .04em; }
.jyut { font-family: var(--ui); color: var(--accent); font-size: .95em; letter-spacing: .02em; }
.gloss { font-family: var(--read-font); }
.gloss.big { font-size: 1.35rem; }
.prompt { font: 600 1rem/1.4 var(--ui); color: var(--muted); display: flex; align-items: center; gap: 6px; }

/* ── home ────────────────────────────────────────────────────────── */
.today { text-align: center; padding: 28px 0 8px; }
.lead { font: 400 1.25rem/1.4 var(--display); margin-bottom: 20px; }
.start {
  display: inline-flex; flex-direction: column; align-items: center; gap: 2px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 18px;
  padding: 18px 44px; font: 600 1.2rem var(--display); cursor: pointer; min-width: 220px;
}
.start .han { font-family: var(--han); font-size: 1.4rem; }
.start .sub { font: 400 .8rem var(--ui); opacity: .9; }
.wide { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--accent); color: var(--accent-ink); cursor: pointer; margin-top: 12px; font-weight: 600; }
.ghost { background: none; color: var(--ink); }
.ghost:hover { border-color: var(--accent); }

/* ── a round ─────────────────────────────────────────────────────── */
.dots { display: flex; gap: 6px; justify-content: center; margin: 14px 0 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dot.done { background: var(--accent); }
.q { text-align: center; }
.q .prompt { justify-content: center; }
.play {
  display: inline-flex; align-items: center; gap: 10px; margin: 10px auto 16px;
  background: var(--chip); border: 1px solid var(--line); border-radius: 999px;
  padding: 12px 22px; cursor: pointer; font-weight: 600;
}
.play .ico { display: grid; place-items: center; }
.play svg { width: 20px; height: 20px; }
html.playing .play { border-color: var(--accent); }
.choices { display: grid; gap: 10px; margin-top: 8px; }
.choices.two { grid-template-columns: 1fr 1fr; }
.choice {
  position: relative; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px 44px 14px 16px; cursor: pointer; min-height: 56px;
  font-family: var(--read-font);
}
.choice:hover { border-color: var(--accent); }
.choices.locked .choice { cursor: default; }
.choice.right { border-color: var(--right); background: var(--right-bg); color: var(--ink); }
.choice.wrong { border-color: var(--wrong); background: var(--wrong-bg); color: var(--ink); }
.choice .mark { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 1.2rem; }
.choice.right .mark { color: var(--right); }
.choice.wrong .mark { color: var(--wrong); }
.choice.tone { display: flex; align-items: baseline; gap: 12px; }
.choice.tone .han { font-size: 1.6rem; }
.after { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; text-align: left; }

/* pieces to tap into order */
.built { min-height: 56px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; border-bottom: 2px dashed var(--line); padding: 10px 0; }
.built.right { border-color: var(--right); }
.built.wrong { border-color: var(--wrong); }
.tray { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.piece { font-family: var(--han); font-size: 1.3rem; background: var(--chip); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; cursor: pointer; }
.piece:disabled { opacity: .25; }

/* ── words, tones, context ───────────────────────────────────────── */
.word { text-align: left; }
.wline { display: flex; align-items: center; gap: 10px; justify-content: center; }
.example { background: var(--chip); border-radius: 12px; padding: 12px; margin-top: 12px; }
.example .han { font-size: 1.3rem; }
.wordset { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.wchip { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: var(--chip); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; cursor: pointer; text-align: left; }
.wchip .han { font-size: 1.25rem; }
.wchip .gloss { font-size: .82em; color: var(--muted); }
.tonelist { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.trow { display: grid; grid-template-columns: auto auto 1fr; gap: 10px; align-items: baseline; }
.trow.big { grid-template-columns: 2rem 3rem 1fr; align-items: center; }
.tnum { font: 700 1.3rem var(--display); color: var(--accent); }
.chao { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .85em; }
.tname { font-size: .95em; }
.toneout { margin-top: 12px; }
.contour { background: var(--chip); border-radius: 12px; padding: 8px; margin: 10px 0; }
.contour svg { width: 100%; height: auto; }
.contour .mid { stroke: var(--line); stroke-width: 1; }
.contour .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.ccard blockquote { margin: 0 0 .7em; padding-left: 14px; border-left: 3px solid var(--accent); font-family: var(--read-font); }
.ctx { margin: 16px 0; }
.gpoint { background: var(--chip); border-radius: 12px; padding: 12px; margin: 10px 0; }

/* progress */
.skill { margin-bottom: 16px; }
.skill .srow { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.skill .num { color: var(--muted); font-size: .85em; font-variant-numeric: tabular-nums; }
.bar-outer, .skill .bar { height: 10px; background: var(--chip); border-radius: 999px; overflow: hidden; margin-top: 6px; }
.skill .fill { height: 100%; background: var(--accent); }
.sdot { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.sdot.met { background: var(--muted); }
.sdot.known, .sdot.secure { background: var(--accent); }
.source { margin-bottom: 18px; }

/* settings sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  background: var(--card); border-radius: 20px 20px 0 0; padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
  max-height: 84vh; overflow: auto; max-width: 640px; margin: 0 auto;
}
.grip { width: 44px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 14px; }
.srow { display: flex; align-items: center; gap: 16px; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); }
.slabel { font-weight: 600; }
.toggle { width: 52px; height: 32px; border-radius: 999px; border: 1px solid var(--line); background: var(--chip); position: relative; cursor: pointer; flex: none; }
.toggle .knob { position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: left .15s, background .15s; }
.toggle.on { background: var(--accent); border-color: var(--accent); }
.toggle.on .knob { left: 25px; background: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"><main><p class="note">Loading the words…</p></main></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
